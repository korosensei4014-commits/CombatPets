name: Build plugin JAR

on:
  push:
    branches: [ bedrock-dialog-support, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # The repository has no Gradle wrapper, so a specific Gradle version is installed here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: CombatPets-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
