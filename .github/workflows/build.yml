name: Build plugin JAR

on:
  push:
    branches: [ bedrock-dialog-support, main ]
    # Pushing a tag like v2.8.4-bedrock.1 also publishes a GitHub Release with the JAR.
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # The repository has no Gradle wrapper, so a specific Gradle version is installed here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: CombatPets-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # A release is published automatically for every new version in build.gradle.kts:
      # bump `version`, push, and the build creates tag v<version> + a Release with the JAR.
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP '^\s*version = "\K[^"]+' build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.released == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: CombatPets v${{ steps.version.outputs.version }}
          generate_release_notes: true
          # Matches CombatPets-<version>.jar but not the -sources.jar
          files: build/libs/CombatPets-*[0-9].jar
          fail_on_unmatched_files: true
