Settings:
  # GUI title.
  Title: <black>ᴘᴇᴛ ʙᴀɢ</black>
  # GUI size. Must be multiply of 9.
  # Useful for 'CHEST' Inventory Type only.
  Size: 54
  # GUI type.
  # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/event/inventory/InventoryType.html
  Inventory_Type: CHEST
  # Sets GUI auto-refresh interval (in seconds). Set this to 0 to disable.
  Auto_Refresh: 0
  PlaceholderAPI:
    # Sets whether PlaceholderAPI placeholders will be applied on all items from the 'Content' section of this GUI.
    # [*] Disable if you don't use any PlaceholderAPI placeholders on your items to improve GUI performance.
    Enabled: false
Pet:
  Name: <lyellow><b>%pet_name%</b></lyellow>
  Lore:
  - ''
  - '<lyellow>▪ <lgray>Level: </lgray>%pet_level%</lyellow>'
  - '<lyellow>▪ <lgray>XP: </lgray>%pet_exp%<lgray>/</lgray>%pet_max_exp%</lyellow>'
  - '<lyellow>▪ <lgray>Saturation: </lgray>%pet_saturation%<lgray>/</lgray>%pet_max_saturation%</lyellow>'
  - '<lyellow>▪ <lgray>Food: </lgray>%pet_food%</lyellow>'
  - ''
  - <lyellow><b>ATTRIBUTES</b></lyellow>
  - '<lyellow>▪ <lgray>Damage: </lgray>%pet_attribute_attack_damage%</lyellow>'
  - '<lyellow>▪ <lgray>Attack Speed: </lgray>%pet_attribute_attack_speed%<lgray>/ sec.</lgray></lyellow>'
  - '<lyellow>▪ <lgray>Health: </lgray>%pet_attribute_max_health%</lyellow>'
  - '<lyellow>▪ <lgray>Regen: </lgray>%pet_attribute_health_regeneration_force%<lgray> x </lgray>%pet_attribute_health_regeneration_speed%<lgray> / sec.</lgray></lyellow>'
  - '<lyellow>▪ <lgray>Defense: </lgray>%pet_attribute_armor%</lyellow>'
  - '<lyellow>▪ <lgray>Speed: W: </lgray>%pet_attribute_movement_speed%<lgray> / F: </lgray>%pet_attribute_flying_speed%</lyellow>'
  - ''
  - '%status%'
  Status:
    Dead_Auto:
    - '<lgray>Status: <lred><b>Dead</b></lred></lgray>'
    - '<lgray>Ressurection in: <lred>%time%</lred></lgray>'
    - ''
    - <lred>[▶] </lred><lgray>Click to revive it for <lred>$%cost%</lred>.</lgray>
    Dead_Manual:
    - '<lgray>Status: <lred><b>Dead</b></lred></lgray>'
    - ''
    - <lred>[▶] </lred><lgray>Click to revive it for <lred>$%cost%</lred>.</lgray>
    Active:
    - '<lgray>Status: <lgreen><b>Summoned</b></lgreen></lgray>'
    - ''
    - <lgreen>[▶] </lgreen><lgray>Click to <lgreen>despawn</lgreen>.</lgray>
    Inactive:
    - '<lgray>Status: <lyellow><b>Idle</b></lyellow></lgray>'
    - ''
    - <lyellow>[▶] </lyellow><lgray>Left-Click to <lyellow>summon</lyellow>.</lgray>
    - <lyellow>[▶] </lyellow><lgray>[Q/Drop] key to <lyellow>release</lyellow>.</lgray>
    # Used instead of Pet.Status.Inactive when Pets.Release.Mode is STORE.
    Inactive_Store_Mode:
    - '<lgray>Status: <lyellow><b>Idle</b></lyellow></lgray>'
    - ''
    - <lyellow>[▶] </lyellow><lgray>Left-Click to <lyellow>summon</lyellow>.</lgray>
    - <lyellow>[▶] </lyellow><lgray>[Q/Drop] key to <lyellow>store in egg</lyellow>.</lgray>
Pets:
  Slots: 10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43
# ==================== GUI CONTENT ====================
# You can freely edit items in this section as you wish (add, remove, modify items).
# The following values are available as button Types:
# CLOSE
# PAGE_NEXT
# PAGE_PREVIOUS
# RETURN
# ==================== ITEM OPTIONS ====================
# > Item: Item to display. Please check: https://nightexpressdev.com/nightcore/configuration/item-formation/
# > Priority: Button priority. Better values will override other item(s) in the same slot(s).
# > Slots: Button slots. From [0] to [Size - 1]. Split with commas.
# > Click_Commands: Execute custom commands on click. PlaceholderAPI available here.
#     Available click types: LEFT, RIGHT, SHIFT_LEFT, SHIFT_RIGHT, DROP_KEY, SWAP_KEY, NUMBER_1, NUMBER_2, NUMBER_3, NUMBER_4, NUMBER_5, NUMBER_6, NUMBER_7, NUMBER_8, NUMBER_9
#     Use prefix 'player:' to run command by a player.
#     Click_Commands:
#       LEFT:
#       - say Hello
#       - give %player_name% diamond 1
#       - player: menu open shops
# ==================================================
