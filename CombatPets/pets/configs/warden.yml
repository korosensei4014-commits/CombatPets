# Sets pet mob type.
# https://nightexpress.gitbook.io/combatpetsfeatures/pet-types
Entity_Type: warden
# Sets default pet name when obtained.
Default_Name: Warden
# Texture URL value for pet egg item.
# Get some at http://minecraft-heads.com
Egg_Skin: 10b3c91b727d87d8c8aa96028f2275b8405debc7516a023d0f7748bab21f9c43
# Sets whether or not this pet can have an inventory.
# Setting this to 'false' will disable inventory for this pet ignoring it's tier inventory option.
Can_Have_Inventory: true
# Sets whether or not this pet can wear items in his equipment slots.
# Setting this to 'false' will disable equipment for this pet ignoring it's tier equipment option.
Can_Have_Equipment: true
# Sets whether or not this pet can be captured by a player.
# Setting this to 'false' will disable capture for this pet ignoring it's tier capture options.
Catchable: true
# Sets particle effect for pet spawn.
Spawn_Particle:
  Name: CLOUD
# Sets particle effect for pet despawn.
Despawn_Particle:
  Name: ASH
Saturation:
  # Sets sound to play when pet ates food item.
  Eat_Sound: entity.generic.eat;1.0;1.0
  # Sets amount of saturation to lost on every tick for certain pet state.
  Exhaust:
    COMBAT: 0.04
    IDLE: 0.01
    WALK: 0.02
  # List of food categories available to feed this pet.
  # You can create or edit them in the main plugin config file.
  # Available categories: [wheat_seeds, eggs, raw_meat, flowers, bread, rotten_flesh, chorus_fruits, cooked_fish, gunpowder, beetroot, mushrooms, bamboo, spider_eyes, wither_roses, raw_fish, sticks, bone_meal, cooked_meat, wheat, carrots, apples]
  # https://nightexpress.gitbook.io/combatpetsfeatures/pet-food
  FoodCategories:
  - raw_meat
  - raw_fish
Attributes:
  # Default (initial) attribute values for this pet.
  # https://nightexpress.gitbook.io/combatpetsfeatures/pet-attributes
  Default:
    flying_speed: 0.0
    scale: 1.0
    attack_speed: 0.3
    attack_damage: 5.0
    water_movement_efficiency: 0.0
    movement_speed: 0.30000001192092896
    horse_jump_strength: 0.41999998688697815
    knockback_resistance: 1.0
    health_regeneration_speed: 1.0
    max_health: 100.0
    safe_fall_distance: 3.0
    armor: 0.0
    explosion_knockback_resistance: 0.0
    attack_knockback: 1.5
    step_height: 0.6
    health_regeneration_force: 0.5
    max_saturation: 375.0
    gravity: 0.08
    burning_time: 1.0
    fall_damage_multiplier: 1.0
    movement_efficiency: 0.0
  # Attribute values added per each aspect value.
  # https://nightexpress.gitbook.io/combatpetsfeatures/pet-attributes
  # https://nightexpress.gitbook.io/combatpetsfeatures/pet-aspects
  Per_Aspect:
    flying_speed: 0.0
    scale: 0.02
    attack_speed: 0.028
    attack_damage: 0.5
    water_movement_efficiency: 0.0
    movement_speed: 0.0030000001192092896
    horse_jump_strength: 0.0
    knockback_resistance: 0.0
    health_regeneration_speed: 0.02
    max_health: 6.0
    safe_fall_distance: 0.0
    armor: 1.0
    explosion_knockback_resistance: 0.0
    attack_knockback: 0.0
    step_height: 0.0
    health_regeneration_force: 0.05
    max_saturation: 50.0
    gravity: 0.0
    burning_time: 0.0
    fall_damage_multiplier: 0.0
    movement_efficiency: 0.0

Capture:
  # Sets the capture chance for this type of pet.
  Chance: 30.0
  # Sets the chance to escape capturing for this type of pet.
  Escape_Chance: 0.5
  # Max. health (in % of max. health) a mob of this type may have to be captured.
  # -1 = use 'Settings.Health_Percent' from the capture config. 100 = can be captured at full health.
  Health_Percent: -1.0
