CombatMode:
  PROTECTIVE_AND_SUPPORTIVE: Protective And Supportive
  PROTECTIVE: Protective
  PASSIVE: Passive
  SUPPORTIVE: Supportive
Command:
  Argument:
    Name:
      Tier: tier
      Pet: pet
  Collection:
    Desc: List of pets you have claimed.
  AddAll:
    Desc: Add all pets to collection.
    Done: <gray>Added all <soft_yellow>%pet_tier_name%</soft_yellow> pets to <soft_yellow>%player_name%</soft_yellow>'s collection!</gray>
  Add:
    Desc: Add pet to collection.
    Done: <gray>Added <soft_yellow>%pet_tier_name% %pet_config_name%</soft_yellow> to <soft_yellow>%player_name%</soft_yellow>'s collection!</gray>
  Remove:
    Desc: Remove pet from collection.
    Done: <gray>Removed <soft_yellow>%pet_tier_name% %pet_config_name%</soft_yellow> from <soft_yellow>%player_name%</soft_yellow>'s collection!</gray>
  RemoveAll:
    Desc: Remove all pets from collection.
    Done: <gray>Removed all <soft_yellow>%pet_tier_name%</soft_yellow> pets from <soft_yellow>%player_name%</soft_yellow>'s collection!</gray>
  CatchItem:
    Desc: Give capture item.
    Done: <gray>Given <soft_yellow>x%amount% %item%</soft_yellow> to <soft_yellow>%player_name%</soft_yellow>!</gray>
  Food:
    Desc: Give food item.
    Done: <gray>Given <soft_yellow>x%amount% %item%</soft_yellow> to <soft_yellow>%player_name%</soft_yellow>!</gray>
  Egg:
    Desc: Give pet egg.
    Done: <gray>Given <soft_yellow>%pet_tier_name% %pet_config_name%</soft_yellow> pet egg to <soft_yellow>%player_name%</soft_yellow>.</gray>
    Revalidate:
      Desc: Make the stored pet egg in your hand hatchable again.
      Done: <soft_green>This egg (<soft_yellow>%pet_name%</soft_yellow>) can hatch again. Make sure no other copy of it is around.</soft_green>
      Already: <soft_yellow>This egg is already valid and can hatch.</soft_yellow>
      NotEgg: <soft_red>Hold a stored pet egg in your main hand.</soft_red>
    Store:
      Desc: Turn a player's pet into a stored egg for you.
      Done: <gray>Stored <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> in an egg for you (plus <soft_yellow>%amount%</soft_yellow> of its items).</gray>
  MysteryEgg:
    Desc: Give mystery egg.
    Done: <gray>Given <soft_yellow>%pet_config_name%</soft_yellow> mystery egg to <soft_yellow>%player_name%</soft_yellow>.</gray>
  Rename:
    Desc: Rename player's pet.
    Done: <gray>Renamed <soft_yellow>%player_name%</soft_yellow>'s pet to <soft_yellow>%pet_name%</soft_yellow>.</gray>
  Revive:
    Desc: Revive player's pet.
    Error:
      Alive: <gray><soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet is not dead!</gray>
    Done: <gray>Revived <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
  ClearInventory:
    Desc: Clear player's pet inventory.
    Done: <gray>Cleared <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet inventory.</gray>
  Menu:
    Desc: Open pet menu.
  Shop:
    Desc: Open shop.
  Accessory:
    Desc: Give accessory item.
    Done: <gray>Given <soft_yellow>%amount% x %name%</soft_yellow> to <soft_yellow>%player_display_name%</soft_yellow>.</gray>
  ResetProgress:
    Desc: Reset leveling for player's pet.
    Done: <gray>Reset leveling progress for <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
  XP:
    Desc: XP commands.
    Add:
      Desc: Add XP to a pet.
      Done: <gray>Added <soft_yellow>%amount%</soft_yellow> XP to <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
    Set:
      Desc: Set XP for a pet.
      Done: <gray>Set <soft_yellow>%amount%</soft_yellow> XP for <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
    Remove:
      Desc: Remove XP off a pet.
      Done: <gray>Removed <soft_yellow>%amount%</soft_yellow> XP off <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
    Reward:
      Desc: Add XP to a player's active pet.
      Done: <gray>Added <soft_yellow>%amount%</soft_yellow> XP to <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
    Penalty:
      Desc: Remove XP off a player's active pet.
      Done: <gray>Removed <soft_yellow>%amount%</soft_yellow> XP off <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
  AspectPoints:
    Desc: Aspect Points commands.
    Add:
      Desc: Add Aspect Points to a pet.
      Done: <gray>Added <soft_yellow>%amount%</soft_yellow> Aspect Points to <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
    Set:
      Desc: Set Aspect Points for a pet.
      Done: <gray>Set <soft_yellow>%amount%</soft_yellow> Aspect Points for <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
    Remove:
      Desc: Remove Aspect Points off a pet.
      Done: <gray>Removed <soft_yellow>%amount%</soft_yellow> Aspect Points off <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
    Reward:
      Desc: Add Aspect Points to a player's active pet.
      Done: <gray>Added <soft_yellow>%amount%</soft_yellow> Aspect Points to <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
    Penalty:
      Desc: Remove Aspect Points off a player's active pet.
      Done: <gray>Removed <soft_yellow>%amount%</soft_yellow> Aspect Points off <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> pet.</gray>
  Syntax:
    InvalidTier: <gray><soft_red>%input%</soft_red> is not a valid tier!</gray>
    InvalidPet: <gray><soft_red>%input%</soft_red> is not a valid pet!</gray>
    InvalidFoodCategory: <gray><soft_red>%input%</soft_red> is not a valid food category!</gray>
    InvalidFoodItem: <gray><soft_red>%input%</soft_red> is not a valid food item!</gray>
    InvalidCustomization: <gray><soft_red>%input%</soft_red> is not a valid customization type!</gray>
  Duel:
    Desc: Challenge a player's pet to a duel.
  Duels:
    Desc: Turn pet duel challenges on or off.
  Surrender:
    Desc: Surrender your current pet duel.
  Admin:
    Desc: Admin commands.
  EggHub:
    Desc: Pet egg tools.
  List:
    Desc: List a player's pets.
    Status:
      Summoned: <green>summoned</green>
      Dead: <red>dead</red>
      Resting: <gray>in collection</gray>
    Header: <gray><soft_yellow>%player_name%</soft_yellow>'s pets (<soft_yellow>%amount%</soft_yellow>):</gray>
    Entry: <gray>- %pet_tier_name% <white>%pet_config_name%</white> <soft_yellow>%pet_name%</soft_yellow> Lv <white>%pet_level%</white> (%type%<gray>)</gray></gray>
    Empty: <gray><soft_yellow>%player_name%</soft_yellow> has no pets.</gray>
  Info:
    Desc: Show details of a player's pet.
    Info:
    - ''
    - <gray><soft_yellow>%pet_name%</soft_yellow> (%pet_tier_name% <white>%pet_config_name%</white><gray>) owned by </gray><soft_yellow>%player_name%</soft_yellow></gray>
    - '<gray>Status: %type%</gray>'
    - '<gray>Level: <white>%pet_level%</white> (<white>%pet_exp%/%pet_max_exp%</white> XP)</gray>'
    - '<gray>Health: <white>%pet_health%</white>, food: <white>%pet_saturation%/%pet_max_saturation%</white></gray>'
    - '<gray>Aspect points: <white>%pet_aspect_points%</white> unspent, <white>%total%</white> spent</gray>'
    - '<gray>Duels: <green>%pet_duel_wins%</green> wins, <red>%pet_duel_losses%</red> losses</gray>'
    - '<gray>Items: <white>%item%</white> in inventory, <white>%amount%</white> equipped</gray>'
  Transfer:
    Desc: Move a pet to another player.
    Done: <gray>Moved <soft_yellow>%pet_name%</soft_yellow> (%pet_tier_name% <white>%pet_config_name%</white><gray>) from </gray><soft_yellow>%item%</soft_yellow> to <soft_yellow>%player_name%</soft_yellow>.</gray>
    Error:
      Same: <soft_red>Pick two different players.</soft_red>
      Has: <soft_red><soft_yellow>%player_name%</soft_yellow> already has a %pet_tier_name% %pet_config_name%.</soft_red>
      Duel: <soft_red>That pet is in a duel. Stop it first with <soft_yellow>/pets admin duel stop %player_name%</soft_yellow>.</soft_red>
  Heal:
    Desc: Fully heal a player's summoned pet.
    Done: <gray>Healed <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow>.</gray>
  Despawn:
    Desc: Send a player's summoned pet back to their collection.
    Done: <gray>Sent <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> back to their collection.</gray>
  AdminDuel:
    Desc: Duel tools.
    Stop:
      Desc: End a player's duel with no winner.
      Done: <gray>Stopped <soft_yellow>%player_name%</soft_yellow>'s duel. No winner, no stat changes.</gray>
      None: <soft_red><soft_yellow>%player_name%</soft_yellow> isn't in a duel.</soft_red>
    ResetStats:
      Desc: Clear a pet's duel wins and losses.
      Done: <gray>Reset duel wins and losses of <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow>.</gray>
  Cooldown:
    Desc: Cooldown tools.
    Reset:
      Desc: Clear a player's Store in Egg cooldown.
      Done: <gray>Cleared <soft_yellow>%player_name%</soft_yellow>'s Store in Egg cooldown.</gray>
      None: <gray><soft_yellow>%player_name%</soft_yellow> has no Store in Egg cooldown.</gray>
  Level:
    Desc: Pet level tools.
    Set:
      Desc: Set a player's pet to a level.
      Done: <gray>Set <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> to level <soft_yellow>%pet_level%</soft_yellow>.</gray>
      DoneReset: <gray>Set <soft_yellow>%player_name%</soft_yellow>'s <soft_yellow>%pet_name%</soft_yellow> to level <soft_yellow>%pet_level%</soft_yellow>. Its aspects were reset (<soft_yellow>%pet_aspect_points%</soft_yellow> points to spend).</gray>
  Error:
    NoActivePet: <soft_red><soft_yellow>%player_name%</soft_yellow> has no summoned pet.</soft_red>
Pet:
  Despawn:
    Death:
    - '[title_times="20:60:20",sound="minecraft:entity.generic.death;0.8;1.0",type="title"]'
    - <soft_red><b>Your Pet Died!</b></soft_red>
    - <gray>Revive it in your collection.</gray>
    Default: <gray>Pet despawned.</gray>
  Claim:
    Error:
      AlreadyHave: <soft_red>You already have this pet!</soft_red>
      ReachedLimit: <soft_red>You can not claim more than <orange>%amount%</orange> %pet_tier_name% pets!</soft_red>
    Success:
    - '[title_times="20:60:20",sound="minecraft:entity.player.levelup;0.8;1.0",type="title"]'
    - <soft_green><b>Pet Claimed!</b></soft_green>
    - '<gray>Check out your collection: <soft_green>/pet collection</soft_green></gray>'
  MysteryEgg:
    Hatch: '[sound="minecraft:entity.evoker.prepare_attack;0.8;1.0"]<gray>You hatched <light_purple>Mystery Egg</light_purple> into <light_purple>%pet_tier_name% %pet_config_default_name%</light_purple> !</gray>'
  Catch:
    Process:
      Progress:
      - '[title_times="0:20:0",type="title"]'
      - <soft_yellow><b>Capturing...</b></soft_yellow>
      - <gray><green><b>Success </b></green>→ <green>%success%% </green>| <red>%failure%% </red>← <red><b>Failure</b></red></gray>
      Success:
      - '[title_times="0:50:0",sound="minecraft:entity.player.levelup;0.8;1.0",type="title"]'
      - <soft_green><b>Mob Captured!</b></soft_green>
      - <gray>You captured <soft_green>%pet_config_default_name%</soft_green> <gray>(<white>%pet_tier_name%</white>)</gray></gray>
      Escaped:
      - '[title_times="0:50:0",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <orange><b>Mob Escaped!</b></orange>
      - <gray>You have to look for another one...</gray>
      Failure:
      - '[title_times="0:50:0",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <soft_red><b>Capture Failed!</b></soft_red>
      - <gray>You were unlucky. Give it another try!</gray>
      TooFarAway:
      - '[title_times="0:50:0",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <soft_red><b>Capture Failed!</b></soft_red>
      - <gray>Stay closer next time!</gray>
    Error:
      NotCatchable: <gray>This <soft_red>%name%</soft_red> can not be captured.</gray>
      NotPermitted: <gray>You don't have permissions to capture <soft_red>%name%</soft_red>.</gray>
      Conditions: <gray><soft_red>%name%</soft_red> is not ready for capture.</gray>
  Leveling:
    LevelUp:
    - '[title_times="20:60:20",sound="minecraft:entity.player.levelup;0.8;1.0",type="title"]'
    - <soft_green><b>Pet Level Up!</b></soft_green>
    - <gray><soft_green>%pet_name%</soft_green> is now level <soft_green>%pet_level%</soft_green>!</gray>
    LevelDown:
    - '[title_times="20:60:20",sound="minecraft:entity.blaze.death;0.8;1.0",type="title"]'
    - <soft_red><b>Pet Level Down!</b></soft_red>
    - <gray><soft_red>%pet_name%</soft_red> is now level <soft_red>%pet_level%</soft_red> :(</gray>
  XP:
    Lose:
      ByDeath: <soft_red>[!] Your pet lost %amount% XP for death.</soft_red>
    Gain:
      ByMob: '[type="action_bar"]<soft_yellow>%pet_name%: </soft_yellow><orange>+%amount% XP</orange>'
  Rename:
    Prompt:
    - '[title_times="20:60:20",sound="minecraft:block.lava.pop;0.8;1.0",type="title"]'
    - <soft_yellow><b>Renaming</b></soft_yellow>
    - <gray>Enter new pet name.</gray>
    Error:
      NoNametag:
      - '[title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <soft_red><b>Unable to Rename!</b></soft_red>
      - <gray>You need a <soft_red>Name Tag</soft_red> item.</gray>
      TooLong:
      - '[title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <soft_red><b>Name Too Long!</b></soft_red>
      - <gray>Max name length is <soft_red>%amount%</soft_red> characters!</gray>
      TooShort:
      - '[title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <soft_red><b>Name Too Short!</b></soft_red>
      - <gray>Min name length is <soft_red>%amount%</soft_red> characters!</gray>
      Forbidden:
      - '[title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <soft_red><b>Unacceptable Name!</b></soft_red>
      - <gray>Name contains <soft_red>forbidden</soft_red> characters!</gray>
      Empty: <soft_red>Please enter a name.</soft_red>
    Success:
    - '[title_times="20:60:20",sound="minecraft:block.note_block.bell;0.8;1.0",type="title"]'
    - <soft_green><b>Pet Renamed!</b></soft_green>
    - <gray>You renamed your pet to <soft_green>%pet_name%</soft_green></gray>
    Dialog:
      Title: <yellow><b>RENAME PET</b></yellow><dark_gray> » </dark_gray><white>%pet_name%</white>
      Body: '<gray>Enter a <green>new name</green> for <white>%pet_name%</white>.</gray><br><gray>Length: <white>%amount% - %max%</white> characters.</gray>'
      Body_NameTag: <yellow>Renaming costs 1 Name Tag, taken when you press Save.</yellow>
      Input: New Name
      Save:
        Label: <green>✔</green> Save
        Width: 150
      Back:
        Label: <soft_yellow>←</soft_yellow> Go Back
        Width: 150
  Revive:
    Error:
      NotEnoughFunds:
      - '[title_times="20:60:20",sound="minecraft:block.anvil.place;0.8;1.0",type="title"]'
      - <soft_red><b>Not Enough Funds!</b></soft_red>
      - <gray>You need <soft_red>%amount%</soft_red> to revive <soft_red>%pet_name%</soft_red>.</gray>
    Success:
    - '[title_times="20:60:20",sound="minecraft:item.totem.use;0.8;1.0",type="title"]'
    - <soft_green><b>Pet Revived!</b></soft_green>
    - <gray>You revived <soft_green>%pet_name%</soft_green> for <soft_green>%amount%</soft_green>.</gray>
  Error:
    NoActivePet:
    - '[title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
    - <soft_red><b>No Active Pet!</b></soft_red>
    - <gray>You have to summon a pet to do that.</gray>
    NotYour: '[sound="minecraft:entity.villager.no;0.8;1.0"]<soft_red>You''re not owning this pet!</soft_red>'
    BadWorld: <soft_red>Pets are disabled in this world.</soft_red>
    AlreadyCollected: <soft_red>%player_name% already have %pet_tier_name% %pet_config_name%!</soft_red>
    NotCollected: <soft_red>Player does not have such pet in his collection!</soft_red>
    NotSummoned: <soft_red>Player does not have a pet summoned!</soft_red>
    RegionSummon: <soft_red>Pets are not allowed in this area.</soft_red>
  Spawn:
    Error:
      Dead:
      - '[title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <soft_red><b>Pet is Dead!</b></soft_red>
      - <gray>You have to revive it before summon!</gray>
      Already:
      - '[title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <soft_red><b>Already Summoned!</b></soft_red>
      - <gray>You can have only one summoned pet.</gray>
      BadPlace:
      - '[title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <soft_red><b>Bad Place!</b></soft_red>
      - <gray>There is not enough space for a pet.</gray>
  Release:
    Success: <gray>You released <soft_yellow>%pet_name%</soft_yellow>!</gray>
    Error:
      BadWorld: <soft_red>You can not release pets in this world!</soft_red>
      ProtectedArea: <soft_red>You can't release pets here!</soft_red>
      Active: <soft_red>Return <soft_yellow>%pet_name%</soft_yellow> to your collection before releasing it!</soft_red>
  Store:
    Success: '[type="action_bar"]<soft_green>Stored <soft_yellow>%pet_name%</soft_yellow> in an egg</soft_green><gray> (%amount%)</gray>'
    Error:
      NotEnoughFunds: <soft_red>You need <soft_yellow>%amount%</soft_yellow> to store <soft_yellow>%pet_name%</soft_yellow> in an egg.</soft_red>
      Dead: <soft_red>Revive <soft_yellow>%pet_name%</soft_yellow> before storing it in an egg.</soft_red>
      NotEmpty: <soft_red>Take everything out of <soft_yellow>%pet_name%</soft_yellow>'s inventory and equipment before storing it in an egg.</soft_red>
      Cooldown: <soft_red>You can store another pet in an egg in <soft_yellow>%time%</soft_yellow>.</soft_red>
  StoredEgg:
    Hatch: '[type="action_bar"]<soft_green><soft_yellow>%pet_name%</soft_yellow> hatched into your collection!</soft_green>'
    Error:
      Used: <soft_red>This egg has already hatched or isn't valid.</soft_red>
      Invalid: <soft_red>This pet's type or tier doesn't exist on this server anymore.</soft_red>
Shop:
  Purchase:
    Error:
      NotEnoughFunds:
      - '[title_times="20:60:20",sound="minecraft:entity.villager.no;0.8;1.0",type="title"]'
      - <soft_red><b>Not Enough Funds!</b></soft_red>
      - <gray>You need <soft_red>%price%</soft_red> to purchase <soft_red>%pet_config_default_name%</soft_red>.</gray>
    Success:
    - '[title_times="20:60:20",sound="minecraft:block.note_block.bell;0.8;1.0",type="title"]'
    - <soft_green><b>Successful Purchase!</b></soft_green>
    - <gray>You bought <soft_green>%pet_config_default_name%</soft_green> egg for <soft_green>%price%</soft_green>.</gray>
Customizer:
  Interact:
    Pet:
      Error:
        NotYour: <soft_red>You can't customize other player pets!</soft_red>
        WrongType: <soft_red>This accessory is not applicable to this pet!</soft_red>
        AlreadyHas: <soft_red>This accessory is already applied to this pet!</soft_red>
Duel:
  Status:
    'On': 'On'
    'Off': 'Off'
  Toggle:
    'On': '<gray>Pet duels <soft_green>on</soft_green>: other players can challenge your pet.</gray>'
    'Off': '<gray>Pet duels <soft_red>off</soft_red>: all challenges are declined automatically.</gray>'
  Error:
    SelfDisabled: <soft_red>Your pet duels are turned off. Turn them on with <soft_yellow>/pets duels on</soft_yellow> first.</soft_red>
    TargetDisabled: <soft_red><soft_yellow>%player_name%</soft_yellow> isn't accepting pet duels.</soft_red>
    Self: <soft_red>You can't duel yourself.</soft_red>
    NoPet: <soft_red>You need a summoned pet to duel.</soft_red>
    TargetNoPet: <soft_red><soft_yellow>%player_name%</soft_yellow> doesn't have a summoned pet.</soft_red>
    InDuel: <soft_red>You are already in a pet duel.</soft_red>
    TargetInDuel: <soft_red><soft_yellow>%player_name%</soft_yellow> is already in a pet duel.</soft_red>
