    CantRide: <soft_red>You can't ride your pet during a duel.</soft_red>
  Request:
    Sent: <gray>Duel challenge sent to <soft_yellow>%player_name%</soft_yellow>. It expires in <soft_yellow>%amount%</soft_yellow> seconds.</gray>
    Received:
    - ''
    - <gray><soft_yellow>%player_name%</soft_yellow> challenged your pet to a duel! Type <soft_yellow>/pets duel %player_name%</soft_yellow> to accept.</gray>
    - <soft_red>The losing pet dies and must be revived.</soft_red>
    Expired: <gray>The pet duel challenge between you and <soft_yellow>%player_name%</soft_yellow> expired.</gray>
    Declined: <gray><soft_yellow>%player_name%</soft_yellow> declined the pet duel.</gray>
  Countdown:
  - '[title_times="0:25:0",type="title"]'
  - <soft_yellow><b>%time%</b></soft_yellow>
  - <gray>Pet duel vs <soft_yellow>%player_name%</soft_yellow></gray>
  Start:
  - '[title_times="0:30:0",type="title"]'
  - <soft_red><b>FIGHT!</b></soft_red>
  - <gray><soft_yellow>%pet_name%</soft_yellow> vs <soft_yellow>%player_name%</soft_yellow>'s pet</gray>
  Win:
  - '[title_times="20:60:20",type="title"]'
  - <soft_green><b>VICTORY!</b></soft_green>
  - <gray><soft_green>%pet_name%</soft_green> defeated <soft_yellow>%player_name%</soft_yellow>'s pet!</gray>
  Lose:
  - '[title_times="20:60:20",type="title"]'
  - <soft_red><b>DEFEAT</b></soft_red>
  - <gray><soft_red>%pet_name%</soft_red> was defeated by <soft_yellow>%player_name%</soft_yellow>'s pet.</gray>
  Draw:
  - '[title_times="20:60:20",type="title"]'
  - <soft_yellow><b>DRAW</b></soft_yellow>
  - <gray>Time is up! Both pets survived.</gray>
  Cancelled: '<gray>The pet duel with <soft_yellow>%player_name%</soft_yellow> was cancelled: <soft_red>%type%</soft_red></gray>'
  CancelReason:
    Left: a player left
    PetGone: a pet is no longer summoned
    OwnerDied: a player died
    TooFar: the pets got too far apart
    Admin: an admin stopped it
  Dialog:
    Title: <yellow><b>PET DUEL</b></yellow><dark_gray> » </dark_gray><white>%player_name%</white>
    Body: '<soft_yellow>%player_name%</soft_yellow><gray> challenges your pet to a duel!</gray><br><br><gray>Their pet: </gray><white>%name%</white><br><gray>Your pet: </gray><white>%pet_name%</white><br><br><soft_red>The losing pet dies and must be revived.</soft_red>'
    Accept:
      Label: <green>✔</green> Accept
      Width: 150
    Decline:
      Label: <red>✘</red> Decline
      Width: 150
  PetInfo: '%pet_name%<gray> (Lv. %pet_level%, %pet_tier_name%<gray>, </gray>%amount%<gray> HP)</gray></gray>'
  Surrender:
    Lose:
    - '[title_times="20:60:20",type="title"]'
    - <soft_red><b>SURRENDERED</b></soft_red>
    - <gray>You gave up the duel against <soft_yellow>%player_name%</soft_yellow>.</gray>
    Win:
    - '[title_times="20:60:20",type="title"]'
    - <soft_green><b>VICTORY!</b></soft_green>
    - <gray><soft_yellow>%player_name%</soft_yellow> surrendered the duel.</gray>
